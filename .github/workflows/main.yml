name: Perbarui Data Saham IDX

on:
  schedule:
    # Berjalan otomatis setiap hari Senin - Jumat jam 16:15 WIB (09:15 UTC) setelah bursa IDX tutup
    - cron: '15 9 * * 1-5'
  workflow_dispatch: # Memunculkan tombol manual agar Anda bisa memicu robot kapan saja

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

        # GANTI MENJADI STRUKTUR SINGKAT DAN BERSIH INI:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'


    # Menggunakan server Ubuntu murni yang bebas blokir SSL/CORS oleh Yahoo Finance
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas requests

    - name: Jalankan Bot Analisis Saham Riil
      run: python bot.py

    - name: Simpan Perubahan Data Ke Repositori
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions Bot"
        git add data_saham.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Data saham asli diperbarui otomatis oleh robot" && git push)
