name: Perbarui Data Saham IDX

on:
  schedule:
    - cron: '15 9 * * 1-5'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Menginstal kebutuhan sistem secara mandiri tanpa mencari file eksternal
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas requests

    - name: Jalankan Bot Analisis Saham Riil
      run: python bot.py

    - name: Simpan Perubahan Data Ke Repositori
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions Bot"
        git add data_saham.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Data saham asli diperbarui" && git push)
